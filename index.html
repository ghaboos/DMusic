<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070708">
  <title>DMusic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">D<span>MUSIC</span></div>
      <div class="eyebrow">YOUR MUSIC LIBRARY</div>
    </header>

    <section class="hero">
      <div class="eyebrow">WELCOME BACK</div>
      <h1>YOUR SOUND.<br>YOUR WORLD.</h1>
    </section>

    <section>
      <div class="section-title"><h2>Folders</h2></div>
      <div id="library" class="library"></div>
    </section>

    <section>
      <div class="section-title"><h2>Tracks</h2></div>
      <div id="tracks" class="tracks"></div>
    </section>
  </main>

  <aside class="player" aria-label="Music player">
    <img id="nowCover" src="assets/covers/track-default.jpg" alt="">
    <div class="now"><b id="nowTitle">Nothing playing</b><small id="nowArtist">Choose a track</small></div>
    <button id="playBtn" class="play-btn" aria-label="Play">▶</button>
    <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  </aside>

  <script src="music-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
